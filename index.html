<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ablaufplan JGA Wochenende Jan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <style>
        @keyframes pulseDot {
            0%, 100% { transform: translateY(-50%) scale(1.2); opacity: 1; }
            50% { transform: translateY(-50%) scale(1.4); opacity: 0.7; }
        }
        @keyframes countdownTickAnimation {
            0% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes fallAndFade {
            0% { opacity: 1; transform: translateY(0) rotate(0deg); }
            100% { opacity: 0; transform: translateY(200px) rotate(720deg); }
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            color: #1a202c;
            overflow-x: hidden;
        }
        #main-title {
            font-family: 'Lobster', cursive;
            text-align: center;
            margin-bottom: 1.5rem;
            font-weight: 700;
            background-image: linear-gradient(to right, #4f46e5, #db2777);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .day-header {
            font-family: 'Lobster', cursive;
            color: #4a5568;
            padding-top: 1.5rem;
            padding-bottom: 0.5rem;
            text-align: center;
            font-size: 1.75rem;
            position: sticky;
            top: -1px;
            background: #f0f4f8;
            z-index: 10;
        }
        .event-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            position: relative;
            z-index: 1;
            padding-left: 1.5rem;
            border-left-width: 6px;
            border-left-style: solid;
            border-left-color: #60a5fa;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .event-card.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
        .event-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-left-color: #f87171;
        }
        .active-card {
            background-color: #ef4444;
            color: white;
            z-index: 2;
            border-left-color: #fca5a5;
        }
        .active-card .text-gray-700, .active-card .text-gray-500, .active-card .text-gray-600 {
            color: #f9fafb;
        }
        .active-card .btn {
            background-color: #ffffff;
            color: #ef4444;
            border: 1px solid #ef4444;
        }
        .active-card .btn:hover { background-color: #fee2e2; }
        .details-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-out, padding 0.5s ease-out;
            background-color: #f9fafb;
        }
        .details-section.open {
            max-height: 500px;
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }
        .active-card .details-section {
            background-color: #fee2e2;
            color: #7f1d1d;
        }
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn:active {
            transform: scale(0.97) translateY(1px);
            filter: brightness(0.9);
        }
        .btn-map { background-color: #3b82f6; color: white; }
        .btn-map:hover { background-color: #2563eb; }
        .btn-ticket { background-color: #10b981; color: white; }
        .btn-ticket:hover { background-color: #059669; }
        #countdown-container {
            background-color: #2d3748;
            color: white;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }
        #countdown { display: inline-block; }
        .countdown-tick { animation: countdownTickAnimation 0.3s ease-out; }
        #progress-bar-column {
            padding-right: 10px;
            position: sticky;
            top: 1rem;
            align-self: flex-start;
            z-index: 20;
        }
        #progress-bar-track {
            width: 8px;
            background-color: #cbd5e1;
            position: relative;
            border-radius: 4px;
        }
        #progress-bar-filled {
            width: 100%;
            background-image: linear-gradient(to bottom, #ef4444, #fca5a5);
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 4px;
            transition: height 0.5s linear;
        }
        .progress-dot {
            width: 16px;
            height: 16px;
            background-color: white;
            border: 3px solid #cbd5e1;
            border-radius: 50%;
            position: absolute;
            left: -4px;
            transform: translateY(-50%);
            z-index: 25;
            transition: all 0.3s ease;
        }
        .progress-dot.active-dot {
            background-color: #ef4444;
            border-color: #ffffff;
            animation: pulseDot 1.5s infinite ease-in-out;
        }
        #qr-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
            opacity: 0; visibility: hidden;
            transform: scale(0.95);
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
        }
        #qr-modal.open { opacity: 1; visibility: visible; transform: scale(1); }
        #qr-modal-content {
            background-color: white; padding: 20px; border-radius: 10px;
            position: relative; width: 90%; height: 90%;
            display: flex; justify-content: center; align-items: center;
        }
        #qr-modal-content img { max-width: 100%; max-height: 100%; object-fit: contain; }
        #qr-modal-close {
            position: absolute; top: 10px; right: 15px; font-size: 2rem;
            font-weight: bold; color: #333; cursor: pointer; line-height: 1;
        }
        #qr-modal-close:hover { color: #ef4444; }
        .event-time-highlight {
            background-color: #e0e7ff;
            color: #4338ca;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
        }
        .active-card .event-time-highlight {
            background-color: #fee2e2;
            color: #b91c1c;
        }
        .btn-surprise {
            background-color: #db2777;
            color: white;
            font-family: 'Lobster', cursive;
            font-size: 1.1rem;
        }
        .btn-surprise:hover { background-color: #c5306c; }
        .active-card .btn-surprise {
            background-color: #ffffff;
            color: #db2777;
            border: 1px solid #db2777;
        }
        .active-card .btn-surprise:hover { background-color: #fce7f3; }
        .surprise-details {
            display: none;
            font-family: 'Lobster', cursive;
            color: #db2777;
            font-size: 1.25rem;
            text-align: center;
            margin-top: 0.75rem;
            width: 100%;
        }
        .active-card .surprise-details { color: #fdf2f8; }
        .confetti-particle {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            opacity: 0;
            animation: fallAndFade 2s linear forwards;
            pointer-events: none;
            z-index: 2000;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <h1 id="main-title" class="text-4xl md:text-5xl">Ablaufplan JGA Wochenende Hamburg</h1>
    
    <div id="hotel-info" class="max-w-4xl mx-auto mb-6"></div>

    <div id="countdown-container" class="text-2xl md:text-3xl font-bold max-w-4xl mx-auto">
        Noch <span id="countdown"></span> bis zum Start!
    </div>

    <div class="flex w-full max-w-4xl mx-auto">
        <div id="progress-bar-column" class="mr-6 md:mr-10 flex-shrink-0">
            <div id="progress-bar-track" style="height: 0px;">
                <div id="progress-bar-filled" style="height: 0%;"></div>
            </div>
        </div>
        <div id="timeline" class="space-y-6 flex-grow min-w-0"></div>
    </div>

    <div id="qr-modal">
        <div id="qr-modal-content">
            <span id="qr-modal-close">×</span>
            <img id="qr-modal-image" src="" alt="Vergrößerter QR-Code">
        </div>
    </div>

    <script>
        const hotelInfo = {
            name: 'east Hotel Hamburg',
            address: 'Simon-von-Utrecht-Straße 31, 20359 Hamburg',
            mapsLink: 'https://www.google.com/maps/search/?api=1&query=east+Hotel+Hamburg',
            bookingCode: 'H-34X-88Z-9K1',
            checkIn: '12.06.2025',
            checkOut: '15.06.2025'
        };

        const events = [
            // Donnerstag, 12.06.2025
            { date: '2025-06-12', startTime: '13:00', endTime: '14:00', title: 'Jan abholen & Verabschiedung', address: 'Deine Haustür', mapsLink: null, ticketInfo: null, bookingCode: null, type: 'event' },
            { date: '2025-06-12', startTime: '14:34', endTime: '15:23', title: 'Zugfahrt Lüneburg → Hamburg Hbf', address: 'Lüneburg (Gleis 4)', mapsLink: 'https://www.google.com/maps/search/?api=1&query=Hamburg+Hbf,+20099+Hamburg', ticketInfo: 'ME RB31 (81672)', bookingCode: null, type: 'event' },
            { date: '2025-06-12', startTime: '15:30', endTime: '16:00', title: 'Check-in im Hotel', address: hotelInfo.address, mapsLink: hotelInfo.mapsLink, ticketInfo: `Buchungsnr: ${hotelInfo.bookingCode}`, bookingCode: null, type: 'event' },
            { date: '2025-06-12', startTime: '19:00', endTime: '21:00', title: 'Abendessen in der Bullerei', address: 'Lagerstraße 34b, 20357 Hamburg', mapsLink: 'https://www.google.com/maps/search/?api=1&query=Bullerei+Hamburg', ticketInfo: 'Reservierung 19:00 Uhr auf "Der Bräutigam"', bookingCode: null, type: 'event' },
            
            // Freitag, 13.06.2025
            { date: '2025-06-13', startTime: '10:00', endTime: '11:30', title: 'Katerfrühstück', address: 'Im Hotel oder Umgebung', mapsLink: null, ticketInfo: null, bookingCode: null, type: 'event' },
            { date: '2025-06-13', startTime: '12:15', endTime: '13:45', title: 'Trampolinhalle JUMP House', address: 'Kieler Str. 572, 22525 Hamburg', mapsLink: 'https://www.google.com/maps/search/?api=1&query=Kieler+Str.+572,+22525+Hamburg', ticketInfo: 'Slot 12:15 – 13:45', bookingCode: 'Buchungscode JH-5731', type: 'event' },
            { date: '2025-06-13', startTime: '16:00', endTime: '17:15', title: 'Escape Room "Spurlos verschwunden"', address: 'Ferdinandstraße 3, 20095 Hamburg', mapsLink: 'https://www.google.com/maps/search/?api=1&query=Ferdinandstraße+3,+20095+Hamburg', ticketInfo: 'pause & play Escape Rooms', bookingCode: 'Buchungscode TE-517', type: 'event' },
            { date: '2025-06-13', startTime: '19:30', endTime: '22:00', title: 'Dinner im Panthera Rodizio', address: 'Ditmar-Koel-Straße 3, 20459 Hamburg', mapsLink: 'https://www.google.com/maps/search/?api=1&query=Panthera+Rodizio+Hamburg', ticketInfo: 'Reservierung 19:30 Uhr auf "Team Jan"', bookingCode: null, type: 'event' },
            { date: '2025-06-13', startTime: '22:00', endTime: null, title: 'Kiez-Tour & Reeperbahn', address: 'Reeperbahn', mapsLink: 'https://www.google.com/maps/search/?api=1&query=Reeperbahn,+Hamburg', ticketInfo: 'Freestyle', bookingCode: null, type: 'event' },

            // Samstag, 14.06.2025
            { date: '2025-06-14', startTime: '11:00', endTime: '12:30', title: 'Ausflug: Start am Hafen', address: 'Landungsbrücken, Brücke 3', mapsLink: 'https://www.google.com/maps/search/?api=1&query=Landungsbrücken,+Hamburg', ticketInfo: null, bookingCode: null, type: 'event' },
            { date: '2025-06-14', startTime: '12:30', endTime: '16:30', title: 'Hafenrundfahrt XXL & Captains Lunch', address: 'Abfahrt Landungsbrücken', mapsLink: 'https://www.google.com/maps/search/?api=1&query=Landungsbrücken,+Hamburg', ticketInfo: 'Exklusive Charter, inkl. Mittagessen an Bord', bookingCode: 'Charter-ID: HH-HAFEN-JGA', type: 'event' },
            { date: '2025-06-14', startTime: '18:30', endTime: '20:30', title: 'Steak & Bier im BLOCK HOUSE', address: 'Kirchenallee 49-51, 20099 Hamburg', mapsLink: 'https://www.google.com/maps/search/?api=1&query=Kirchenallee+49-51,+20099+Hamburg', ticketInfo: 'Reservierung 18:30 Uhr auf Opitz', bookingCode: null, type: 'event' },
            { date: '2025-06-14', startTime: '23:00', endTime: null, title: 'NOHO Club Hamburg', address: 'Nobistor 10, 22767 Hamburg', mapsLink: 'https://www.google.com/maps?q=NOHO+Club', ticketInfo: 'VIP-Reservierung auf Opitz', bookingCode: null, type: 'event' },

            // Sonntag, 15.06.2025
            { date: '2025-06-15', startTime: '11:00', endTime: '13:00', title: 'Brunch & Auschecken', address: 'East Hotel oder Umgebung', mapsLink: hotelInfo.mapsLink, ticketInfo: null, bookingCode: null, type: 'event' },
            { date: '2025-06-15', startTime: '14:00', endTime: '15:30', title: 'Besuch im Rathaus', address: 'Rathausmarkt 1, 20095 Hamburg', mapsLink: 'https://www.google.com/maps/search/?api=1&query=Rathausmarkt+1,+20095+Hamburg', ticketInfo: 'Einfach mal Kultur.', bookingCode: null, type: 'event' },
            { date: '2025-06-15', startTime: '20:00', endTime: '22:00', title: 'Highlight: Dinner im "Clouds"', address: 'Reeperbahn 1, 20359 Hamburg', mapsLink: 'https://www.google.com/maps/search/?api=1&query=Clouds+Heavens+Bar+Kitchen+Hamburg', ticketInfo: 'Reservierung Fensterplatz auf "Der Bräutigam"', bookingCode: 'Das große Finale!', type: 'event' },
            { date: '2025-06-15', startTime: '22:30', endTime: null, title: 'Gemütlicher Ausklang & Abreise', address: 'Hamburg Hbf', mapsLink: 'https://www.google.com/maps/search/?api=1&query=Hamburg+Hbf', ticketInfo: null, bookingCode: null, type: 'event' },
        ];

        const timelineContainer = document.getElementById('timeline');
        const countdownElement = document.getElementById('countdown');
        const countdownContainerElement = document.getElementById('countdown-container');
        const progressBarTrack = document.getElementById('progress-bar-track');
        const progressBarFilled = document.getElementById('progress-bar-filled');
        const qrModal = document.getElementById('qr-modal');
        const qrModalImage = document.getElementById('qr-modal-image');
        const qrModalClose = document.getElementById('qr-modal-close');

        function createHotelInfoCard(info) {
             const hotelContainer = document.getElementById('hotel-info');
             hotelContainer.innerHTML = `
                <div class="event-card is-visible p-4 md:p-6" style="border-left-color: #a78bfa;">
                    <h2 class="text-xl md:text-2xl font-semibold mb-2">Unterkunft: ${info.name}</h2>
                    <p class="text-sm text-gray-600 mb-1">${info.address}</p>
                    <p class="text-sm text-gray-600 mb-3"><strong>Check-in:</strong> ${info.checkIn} · <strong>Check-out:</strong> ${info.checkOut}</p>
                    <p class="text-sm text-gray-700 font-medium mb-3">Buchungsnummer: ${info.bookingCode}</p>
                     <div class="flex flex-wrap gap-2 mt-2">
                        <a href="${info.mapsLink}" target="_blank" rel="noopener noreferrer" class="btn btn-map">Hotel auf Maps</a>
                    </div>
                </div>`;
        }

        function createDayHeader(dateStr) {
            const date = new Date(dateStr);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const formattedDate = date.toLocaleDateString('de-DE', options);
            const header = document.createElement('h3');
            header.className = 'day-header';
            header.textContent = formattedDate;
            return header;
        }

        function createEventCard(event, index) {
            const card = document.createElement('div');
            card.className = 'event-card p-4 md:p-6';
            card.id = `event-${index}`;

            let timeDisplay = `${event.startTime}`;
            if (event.endTime) {
                timeDisplay += ` – ${event.endTime}`;
            } else {
                timeDisplay += ` – Open End`;
            }

            let directInfoHtml = '';
            if (event.address) {
                directInfoHtml += `<p class="text-sm text-gray-500 mb-1">${event.address}</p>`;
            }

            let infoTextParts = [];
            if (event.ticketInfo) infoTextParts.push(event.ticketInfo);
            if (event.bookingCode && event.title !== 'NOHO Club Hamburg') infoTextParts.push(event.bookingCode);
            if (infoTextParts.length > 0) {
                directInfoHtml += `<p class="text-sm text-gray-600 mb-3">${infoTextParts.join(' · ')}</p>`;
            }

            let surpriseButtonHtml = '';
            let surpriseDetailsHtml = '';
            let isNohoEvent = event.title === 'NOHO Club Hamburg';

            if (isNohoEvent && event.bookingCode) {
                surpriseButtonHtml = `<button class="btn btn-surprise mt-2 w-full sm:w-auto">Überraschung anzeigen!</button>`;
                surpriseDetailsHtml = `<div class="surprise-details">${event.bookingCode}</div>`;
            }

            let detailsHtml = '';
            const shouldShowTicketQRButton = isNohoEvent || (event.ticketInfo && event.title.includes('Zugfahrt')) || (event.bookingCode && !isNohoEvent && !event.title.includes('Dinner'));

            if (shouldShowTicketQRButton) {
                detailsHtml = `
                <div id="details-${index}" class="details-section mt-3 px-4 text-sm text-center">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Rickrolling_QR_code.png" alt="QR-Code Ticket" class="qr-code-image w-32 h-32 md:w-40 md:h-40 mx-auto mt-2 rounded-lg shadow-md cursor-pointer" data-qr-src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Rickrolling_QR_code.png">
                </div>`;
            }

            card.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-2">
                    <h2 class="text-xl md:text-2xl font-semibold mb-1 sm:mb-0"><span>${event.title}</span></h2>
                    <p class="text-lg font-medium text-gray-700"><span class="event-time-highlight">${timeDisplay}</span></p>
                </div>
                ${directInfoHtml}
                <div class="flex flex-wrap gap-2 mt-2">
                    ${event.mapsLink ? `<a href="${event.mapsLink}" target="_blank" rel="noopener noreferrer" class="btn btn-map">Maps</a>` : ''}
                    ${shouldShowTicketQRButton ? `<button class="btn btn-ticket" data-details-target="details-${index}">Ticket / QR-Code</button>` : ''}
                </div>
                ${surpriseButtonHtml}
                ${surpriseDetailsHtml}
                ${detailsHtml}
            `;

            if (isNohoEvent && event.bookingCode) {
                const surpriseButton = card.querySelector('.btn-surprise');
                const surpriseDetailsElement = card.querySelector('.surprise-details');
                surpriseButton.addEventListener('click', () => {
                    const isHidden = surpriseDetailsElement.style.display === 'none' || !surpriseDetailsElement.style.display;
                    surpriseDetailsElement.style.display = isHidden ? 'block' : 'none';
                    surpriseButton.textContent = isHidden ? 'Überraschung! 🎉' : 'Überraschung ausblenden';
                    setTimeout(setupProgressBarLayout, 50);
                });
            }

            if (shouldShowTicketQRButton) {
                const ticketButton = card.querySelector(`[data-details-target="details-${index}"]`);
                if(ticketButton) {
                    ticketButton.addEventListener('click', () => {
                        const detailsSection = document.getElementById(`details-${index}`);
                        if (detailsSection) {
                            detailsSection.classList.toggle('open');
                            setTimeout(setupProgressBarLayout, 510);
                        }
                    });
                }
                const qrImage = card.querySelector('.qr-code-image');
                if (qrImage) {
                    qrImage.addEventListener('click', (e) => {
                        qrModalImage.src = e.target.dataset.qrSrc;
                        qrModal.classList.add('open');
                    });
                }
            }
            return card;
        }

        if(qrModalClose) qrModalClose.addEventListener('click', () => qrModal.classList.remove('open'));
        if(qrModal) qrModal.addEventListener('click', (e) => { if (e.target === qrModal) qrModal.classList.remove('open'); });

        function triggerConfetti(count = 50) {
            const confettiColors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#db2777'];
            const targetCard = document.querySelector('.active-card');
            let targetRect = targetCard ? targetCard.getBoundingClientRect() : { top: window.innerHeight / 2, left: window.innerWidth / 2, width: 0, height: 0 };

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('confetti-particle');
                particle.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                
                const startX = targetRect.left + Math.random() * targetRect.width;
                const startY = targetRect.top + Math.random() * targetRect.height;
                
                particle.style.left = `${startX}px`;
                particle.style.top = `${startY}px`;
                
                const duration = Math.random() * 1.5 + 1.5;
                particle.style.animationDuration = `${duration}s`;
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), duration * 1000);
            }
        }

        function setupProgressBarLayout() {
            if (!timelineContainer || !progressBarTrack) return;
            requestAnimationFrame(() => {
                const elements = timelineContainer.querySelectorAll('.event-card, .day-header');
                if (elements.length === 0) { progressBarTrack.style.height = '0px'; return; }
                
                const lastElement = elements[elements.length - 1];
                if (!lastElement) return;

                const timelineHeight = lastElement.offsetTop + lastElement.offsetHeight;
                progressBarTrack.style.height = `${timelineHeight}px`;

                progressBarTrack.querySelectorAll('.progress-dot').forEach(dot => dot.remove());
                const trackRect = progressBarTrack.getBoundingClientRect();

                timelineContainer.querySelectorAll('.event-card').forEach((card, index) => {
                    const dot = document.createElement('div');
                    dot.className = 'progress-dot';
                    dot.id = `progress-dot-${card.id.split('-')[1]}`;
                    const cardRect = card.getBoundingClientRect();
                    const dotTopInTrack = (cardRect.top + cardRect.height / 2) - trackRect.top;
                    dot.style.top = `${dotTopInTrack}px`;
                    progressBarTrack.appendChild(dot);
                });
            });
        }
        
        function updateTimelineAndProgress() {
            const now = new Date();
            let activeEventFound = false;

            if (events.length > 0) {
                const [startHour, startMinute] = events[0].startTime.split(':');
                const firstEventDateTime = new Date(events[0].date);
                firstEventDateTime.setHours(startHour, startMinute, 0, 0);

                const diff = firstEventDateTime - now;
                if (diff > 0) {
                    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((diff % (1000 * 60)) / 1000);
                    const newCountdownText = `${d}T ${h}Std ${m}Min ${s}Sek`;
                    if (countdownElement.textContent !== newCountdownText) {
                        countdownElement.textContent = newCountdownText;
                        countdownElement.classList.add('countdown-tick');
                        setTimeout(() => countdownElement.classList.remove('countdown-tick'), 300);
                    }
                    countdownContainerElement.style.display = 'block';
                } else {
                    countdownContainerElement.style.display = 'none';
                }
            }

            events.forEach((event, index) => {
                if (event.type !== 'event') return;

                const cardElement = document.getElementById(`event-${index}`);
                const dot = document.getElementById(`progress-dot-${index}`);
                if (!cardElement || !dot) return;

                const [startHour, startMinute] = event.startTime.split(':');
                const eventStartDate = new Date(event.date);
                eventStartDate.setHours(startHour, startMinute, 0, 0);

                let eventEndDate;
                if (event.endTime) {
                    const [endHour, endMinute] = event.endTime.split(':');
                    eventEndDate = new Date(event.date);
                    eventEndDate.setHours(endHour, endMinute, 0, 0);
                    if (eventEndDate < eventStartDate) {
                         eventEndDate.setDate(eventEndDate.getDate() + 1);
                    }
                } else {
                    eventEndDate = new Date(event.date);
                    eventEndDate.setDate(eventEndDate.getDate() + 1);
                }

                const isActiveNow = now >= eventStartDate && now <= eventEndDate;
                if (isActiveNow && !activeEventFound) {
                    if (!cardElement.classList.contains('active-card')) {
                        cardElement.classList.add('active-card');
                    }
                    dot.classList.add('active-dot');
                    activeEventFound = true;
                } else {
                    cardElement.classList.remove('active-card');
                    dot.classList.remove('active-dot');
                }
            });

            const firstEvent = events[0];
            const lastEvent = events[events.length - 1];
            
            const overallStart = new Date(firstEvent.date);
            overallStart.setHours(...firstEvent.startTime.split(':'), 0, 0);

            const overallEnd = new Date(lastEvent.date);
            if (lastEvent.endTime) {
                 overallEnd.setHours(...lastEvent.endTime.split(':'), 0, 0);
            } else {
                 overallEnd.setHours(23, 59, 59, 999);
            }
             if (overallEnd < overallStart) {
                 overallEnd.setDate(overallEnd.getDate() + 1);
            }

            const totalDuration = overallEnd.getTime() - overallStart.getTime();
            if (now < overallStart) {
                progressBarFilled.style.height = '0%';
            } else if (now > overallEnd) {
                progressBarFilled.style.height = '100%';
            } else {
                const elapsed = now.getTime() - overallStart.getTime();
                const progressPercentage = (elapsed / totalDuration) * 100;
                progressBarFilled.style.height = `${Math.min(100, progressPercentage)}%`;
            }
        }

        createHotelInfoCard(hotelInfo);

        let lastDate = null;
        events.forEach((event, index) => {
            if (event.date !== lastDate) {
                timelineContainer.appendChild(createDayHeader(event.date));
                lastDate = event.date;
            }
            const card = createEventCard(event, index);
            timelineContainer.appendChild(card);
        });

        const cardsToObserve = document.querySelectorAll('.event-card');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    entry.target.style.transitionDelay = `${index * 0.05}s`;
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });
        cardsToObserve.forEach(card => observer.observe(card));

        setTimeout(() => {
            requestAnimationFrame(() => {
                setupProgressBarLayout();
                updateTimelineAndProgress();
                setInterval(updateTimelineAndProgress, 1000);
            });
        }, 300);

        window.addEventListener('resize', setupProgressBarLayout);
    </script>
</body>
</html>
